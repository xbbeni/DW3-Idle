name: web
on: [push, pull_request]

jobs:
  build:
    # the browser build (tools/build_web.py), with the game's tables taken out
    # of dw3.wasm (tools/web_fill.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: native
      - name: dw3_decomp at DECOMP_COMMIT
        run: |
          commit=$(sed -n 's/^DECOMP_COMMIT = "\(.*\)"/\1/p' native/build.py)
          git init -q dw3_decomp
          git -C dw3_decomp remote add origin https://github.com/ReGame-Labs/dw3_decomp
          git -C dw3_decomp fetch -q --depth 1 origin "$commit"
          git -C dw3_decomp checkout -q FETCH_HEAD
          git -C dw3_decomp submodule update -q --init --depth 1 external/psyq_headers
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache
      - name: SDL 3.4.16 for the web
        run: |
          git clone -q --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL sdl-src
          emcmake cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl-web" > /dev/null
          cmake --build sdl-build -j"$(nproc)" > /dev/null
          cmake --install sdl-build > /dev/null
          echo "SDL_WEB=$PWD/sdl-web" >> "$GITHUB_ENV"
      - name: the port's release at the same game code (its exe's debug info and dw2003.fill; none of the game)
        env:
          UPSTREAM_TAG: v0.19.5
        run: |
          curl -sSLf -o upstream.zip "https://github.com/Feerdus95/dw3-native-port/releases/download/$UPSTREAM_TAG/dw2003-native-$UPSTREAM_TAG.zip"
          mkdir upstream && unzip -q upstream.zip dw2003.exe dw2003.fill -d upstream
          pip install -q pyelftools
          echo "UPSTREAM=$PWD/upstream" >> "$GITHUB_ENV"
      - name: build
        run: python3 native/tools/build_web.py
      - name: report
        if: always()
        run: cat native/build-web/report.md 2>/dev/null || true
      - name: smoke test (the page loads, its wasm starts and asks for the disc)
        run: |
          cd native/build-web
          python3 -m http.server 8000 > /dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom http://localhost:8000/index.html > dom.html 2> chrome.log || true
          grep -o '<div id="status">[^<]*</div>' dom.html || true
          grep -q 'Primeira vez' dom.html || { tail -40 chrome.log; exit 1; }
      - name: the page (the build's own files; none of the game)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir site
          cp native/build-web/index.html native/build-web/index.js native/build-web/index.wasm native/build-web/dw3.fill site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: site

  deploy:
    # GitHub Pages, from main: the page the game is played on
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
