<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DW3 (web)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0f1a; color: #dfe6f3; font: 15px/1.5 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  header { width: min(960px, 100%); padding: 16px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .note { color: #8a97ad; font-size: 13px; margin: 0; }
  #panel { width: min(960px, 100%); padding: 0 16px 12px; box-sizing: border-box; }
  #status { margin: 8px 0; min-height: 1.5em; }
  button { background: #2b5bd7; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px;
           font: inherit; cursor: pointer; display: inline-block; }
  button:disabled { background: #39425a; cursor: default; }
  .hidden { display: none !important; }
  canvas { display: none; background: #000; width: min(960px, 100vw); aspect-ratio: 4 / 3; outline: none; }
  #speed { display: none; gap: 6px; align-items: center; padding: 8px 0; color: #8a97ad; font-size: 13px; }
  #speed button { padding: 6px 12px; background: #39425a; }
  #speed button.on { background: #2b5bd7; }
  small.link { color: #8a97ad; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>DW3 (web)</h1>
  <p class="note">Carregamento e extração automática da ROM integrados.</p>
</header>
<div id="panel">
  <div id="status">A preparar o sistema…</div>
  <div id="play" class="hidden">
    <button id="start">Iniciar Jogo</button>
    <small class="link" id="forget">apagar os dados do jogo deste navegador</small>
  </div>
</div>
<div id="speed">Velocidade:
  <button data-x="1">1x</button><button data-x="2">2x</button><button data-x="3">3x</button><button data-x="4">4x</button><button data-x="5">5x</button>
  <span>(ou Tab no teclado)</span>
</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  const $ = (id) => document.getElementById(id);
  const status = (t) => { $('status').textContent = t; };
  const ROOT = '/dw3', DATA = ROOT + '/data', SAVES = ROOT + '/saves', OPFS_DIR = 'dw3data';
  const ROM_FILENAME = 'Digimon World 2003 (Europe) (En,Fr,De,Es,It).chd';
  const ROM_URL = 'https://huggingface.co/datasets/xbbeni/dmw3.chd/resolve/main/Digimon%20World%202003%20(Europe)%20(En%2CFr%2CDe%2CEs%2CIt).chd?download=true';

  let synced = Promise.resolve();
  function sync(load) {
    synced = synced.then(() => new Promise((ok) => FS.syncfs(load, (e) => { if (e) console.warn('syncfs', e); ok(); })));
    return synced;
  }

  async function opfsDir(create) {
    return (await navigator.storage.getDirectory()).getDirectoryHandle(OPFS_DIR, { create });
  }

  async function extracted() {
    try { await (await opfsDir(false)).getFileHandle('SLES_039.36'); return true; } catch (e) { return false; }
  }

  async function storeData() {
    const files = [];
    (function walk(path) {
      for (const name of FS.readdir(path)) {
        if (name === '.' || name === '..') continue;
        const full = path + '/' + name;
        if (FS.isDir(FS.stat(full).mode)) walk(full); else files.push(full.slice(DATA.length + 1));
      }
    })(DATA);
    files.sort((a, b) => (a === 'SLES_039.36') - (b === 'SLES_039.36'));
    const root = await opfsDir(true);
    let n = 0;
    for (const rel of files) {
      let dir = root;
      const parts = rel.split('/');
      for (const d of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(d, { create: true });
      const w = await (await dir.getFileHandle(parts[parts.length - 1], { create: true })).createWritable();
      await w.write(FS.readFile(DATA + '/' + rel));
      await w.close();
      FS.unlink(DATA + '/' + rel);
      if (++n % 50 === 0) status('A guardar no navegador… ' + Math.round(100 * n / files.length) + '%');
    }
  }

async function downloadAndExtract() {
    try {
      status('A descarregar a ROM do Hugging Face (400MB)...');
      const response = await fetch(ROM_URL);
      if (!response.ok) throw new Error('Falha no download: ' + response.statusText);

      const reader = response.body.getReader();
      const contentLength = +response.headers.get('Content-Length');
      let receivedLength = 0;
      let chunks = [];

      while(true) {
        const {done, value} = await reader.read();
        if (done) break;
        chunks.push(value);
        receivedLength += value.length;
        if (contentLength) {
          let percent = Math.round((receivedLength / contentLength) * 100);
          status(`A descarregar a ROM… ${percent}%`);
        }
      }

      let chunksAll = new Uint8Array(receivedLength);
      let position = 0;
      for(let chunk of chunks) {
        chunksAll.set(chunk, position);
        position += chunk.length;
      }

      status('A injetar ROM no emulador para extração…');
      try { FS.mkdir('/disc'); } catch (e) {}
      // Usa o nome exato do arquivo do Hugging Face aqui
      FS.writeFile('/disc/' + ROM_FILENAME, chunksAll);

      status('A extrair os dados do jogo (pode levar alguns segundos)…');
      await new Promise((r) => setTimeout(r, 50));
      
      let code;
      try {
        // A linha que você perguntou fica exatamente aqui dentro:
        code = callMain(['--extract', '/disc/' + ROM_FILENAME]);
      } catch (e) {
        console.error(e);
        throw new Error('Erro na extração: ' + e.message);
      }

      try { FS.unlink('/disc/' + ROM_FILENAME); } catch (e) {}

      if (code !== 0) {
        throw new Error('A extração falhou com código ' + code);
      }

      status('A guardar os dados permanentemente no navegador…');
      await storeData();
      status('Tudo pronto!');
      $('play').classList.remove('hidden');
    } catch (err) {
      status('Erro: ' + err.message);
      console.error(err);
    }
  }

  var Module = {
    canvas: $('canvas'),
    noInitialRun: true,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    setStatus: (t) => { if (t && t.startsWith('Downloading')) status('A carregar os arquivos do emulador…'); },
    preRun: [() => {
      FS.mkdirTree(DATA);
      FS.mkdirTree(SAVES);
      FS.mount(IDBFS, {}, SAVES);
      addRunDependency('dw3-saves');
      sync(true).then(() => removeRunDependency('dw3-saves'));
      
      addRunDependency('dw3-fill');
      fetch('dw3.fill').then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then((t) => FS.writeFile('/dw3.fill', t))
        .catch((e) => status('Não consegui baixar dw3.fill (' + e + ').'))
        .finally(() => removeRunDependency('dw3-fill'));
    }],
    onRuntimeInitialized: async () => {
      if (!navigator.storage || !navigator.storage.getDirectory) {
        status('Este navegador não suporta armazenamento OPFS.');
        return;
      }
      if (await extracted()) {
        status('O jogo está pronto para iniciar.');
        $('play').classList.remove('hidden');
      } else {
        await downloadAndExtract();
      }
    },
  };

  $('start').addEventListener('click', () => {
    $('panel').classList.add('hidden');
    $('canvas').style.display = 'block';
    $('canvas').focus();
    setInterval(() => sync(false), 10000);
    addEventListener('pagehide', () => FS.syncfs(false, () => {}));
    
    const ffIndex = Module.ccall('native_web_speed_address', 'number', [], []) >> 2;
    callMain([]);
    
    const speed = $('speed');
    speed.style.display = 'flex';
    const mark = (x) => speed.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.x === x));
    speed.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      Module.HEAP32[ffIndex] = +b.dataset.x;
      mark(+b.dataset.x);
      $('canvas').focus();
    }));
    mark(1);
    setInterval(() => mark(Module.HEAP32[ffIndex]), 500);
  });

  $('forget').addEventListener('click', async () => {
    if (!confirm('Apagar os dados do jogo e os saves deste navegador?')) return;
    try { await (await navigator.storage.getDirectory()).removeEntry(OPFS_DIR, { recursive: true }); } catch (e) {}
    indexedDB.deleteDatabase(SAVES);
    location.reload();
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
